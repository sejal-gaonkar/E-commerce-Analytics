

name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:5432/ecommerce

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn "psycopg[binary]" pytest httpx

      - name: Create database tables
        run: |
          python -c "import os, psycopg; conn=psycopg.connect(os.environ['DATABASE_URL']); conn.execute(open('sql/schema.sql').read()); conn.commit(); conn.close()"

      - name: Run API tests
        run: python -m pytest -v
